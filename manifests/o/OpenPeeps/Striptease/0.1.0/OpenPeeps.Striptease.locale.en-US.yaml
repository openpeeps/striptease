ShortDescription: Strip metadata tags from audio, image, raw and video files
Description: Strip metadata from photos, audios, and videos. Written in Nim, zero dependencies, single static binary. Supports WAV, JPEG, PNG, GIF, WebP, TIFF/RAW, CR3, HEIC, MP4/MOV, AVI and MKV. Size-preserving edits keep files playable with no re-encode. Includes --dry-run, --inspect and --verbose reporting.
