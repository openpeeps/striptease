ShortDescription: Strip metadata tags from audio, image, raw, video and text files
Description: Strip metadata from photos, audios, and videos, plus invisible Unicode (zero-width chars, exotic spaces, bidi overrides, tag chars) from text files. Written in Nim, zero dependencies, single static binary. Supports WAV, JPEG, PNG, GIF, WebP, TIFF/RAW, CR3, HEIC, MP4/MOV, AVI, MKV and TXT/MD/JSON/HTML. Size-preserving edits keep files playable with no re-encode. Includes --dry-run, --inspect and --verbose reporting.
